<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1900" viewBox="0 0 2800 1900" role="img" aria-labelledby="title desc">
  <title id="title">ER Diagram ระบบ MONSTOPIA</title>
  <desc id="desc">แผนภาพความสัมพันธ์ 12 ตาราง อ้างอิง Laravel migrations ของระบบ MONSTOPIA</desc>
  <defs>
    <style>
      .canvas{fill:#f7f8f8}.section{fill:#eef1f1;stroke:#d8dddd;stroke-width:2}.box{fill:#fff;stroke:#172126;stroke-width:3}.head{fill:#172126}.headText{fill:#fff;font:700 27px Arial,sans-serif}.field{fill:#253138;font:22px Arial,sans-serif}.key{fill:#e54132;font:700 19px Arial,sans-serif}.note{fill:#667178;font:19px Arial,sans-serif}.sectionTitle{fill:#e54132;font:700 22px Arial,sans-serif;letter-spacing:3px}.title{fill:#172126;font:700 46px Arial,sans-serif}.subtitle{fill:#667178;font:24px Arial,sans-serif}.rel{fill:none;stroke:#647078;stroke-width:3}.relStrong{fill:none;stroke:#e54132;stroke-width:4}.cardinality{fill:#172126;font:700 20px Arial,sans-serif}.legend{fill:#fff;stroke:#d8dddd;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#647078"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e54132"/></marker>
  </defs>
  <rect class="canvas" width="2800" height="1900"/>
  <text class="title" x="90" y="78">ER Diagram - MONSTOPIA Information System</text>
  <text class="subtitle" x="90" y="116">Relational schema from Laravel 12 migrations - MySQL / InnoDB / UTF8MB4</text>

  <rect class="section" x="60" y="145" width="2680" height="475" rx="30"/>
  <text class="sectionTitle" x="95" y="195">PUBLIC WEBSITE CONTENT</text>
  <rect class="section" x="60" y="650" width="2680" height="1170" rx="30"/>
  <text class="sectionTitle" x="95" y="700">CLIENT AND PROJECT WORKFLOW</text>

  <!-- relationship lines rendered behind entities -->
  <path class="relStrong" d="M1000 410 L1060 410" marker-end="url(#arrowRed)"/>
  <text class="cardinality" x="1010" y="394">1</text><text class="cardinality" x="1040" y="394">N</text>

  <path class="rel" d="M1000 955 L1060 955" marker-end="url(#arrow)"/>
  <text class="cardinality" x="1010" y="939">1</text><text class="cardinality" x="1040" y="939">N</text>
  <path class="rel" d="M520 875 H545 V705 H1555 V945 H1480" marker-end="url(#arrow)"/>
  <text class="note" x="720" y="695">staff/admin writes (user_id)</text>
  <path class="relStrong" d="M1000 800 H1030 V660 H1685 V820 H1720" marker-end="url(#arrowRed)"/>
  <text class="cardinality" x="1045" y="648">inquiries 0..1 project</text><text class="cardinality" x="1640" y="805">0..1</text>
  <path class="relStrong" d="M520 1020 H540 V1175 H1685 V880 H1720" marker-end="url(#arrowRed)"/>
  <text class="note" x="780" y="1160">client_user_id / updated_by</text>
  <path class="relStrong" d="M1980 1110 C1920 1190 1650 1210 1500 1280" marker-end="url(#arrowRed)"/>
  <path class="relStrong" d="M2020 1110 L2020 1280" marker-end="url(#arrowRed)"/>
  <path class="relStrong" d="M2100 1110 C2200 1190 2440 1210 2520 1280" marker-end="url(#arrowRed)"/>
  <text class="cardinality" x="1945" y="1180">1:N</text><text class="cardinality" x="2040" y="1190">1:N</text><text class="cardinality" x="2285" y="1205">1:N</text>
  <path class="rel" d="M430 1110 V1240 H1520 V1420 H1540" marker-end="url(#arrow)"/>
  <path class="rel" d="M450 1110 V1205 H2150 V1420 H2180" marker-end="url(#arrow)"/>
  <text class="note" x="1160" y="1265">updates.user_id</text><text class="note" x="1700" y="1230">attachments.user_id</text>

  <!-- content entities -->
  <g transform="translate(90 230)"><rect class="box" width="430" height="330" rx="18"/><rect class="head" width="430" height="62" rx="18"/><rect class="head" y="42" width="430" height="20"/><text class="headText" x="24" y="41">company_profiles</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="field" x="24" y="132">name, tagline</text><text class="field" x="24" y="168">description</text><text class="field" x="24" y="204">email, phone, address</text><text class="field" x="24" y="240">registration_number</text><text class="field" x="24" y="276">is_published</text><text class="note" x="24" y="312">created_at, updated_at</text></g>
  <g transform="translate(570 230)"><rect class="box" width="430" height="330" rx="18"/><rect class="head" width="430" height="62" rx="18"/><rect class="head" y="42" width="430" height="20"/><text class="headText" x="24" y="41">services</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="220" y="96">UQ</text><text class="field" x="275" y="96">slug</text><text class="field" x="24" y="132">title</text><text class="field" x="24" y="168">short_description</text><text class="field" x="24" y="204">description, icon_label</text><text class="field" x="24" y="240">display_order</text><text class="field" x="24" y="276">is_published</text><text class="note" x="24" y="312">created_at, updated_at</text></g>
  <g transform="translate(1060 230)"><rect class="box" width="470" height="330" rx="18"/><rect class="head" width="470" height="62" rx="18"/><rect class="head" y="42" width="470" height="20"/><text class="headText" x="24" y="41">service_packages</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="220" y="96">FK</text><text class="field" x="275" y="96">service_id</text><text class="field" x="24" y="132">name, price_label</text><text class="field" x="24" y="168">delivery_time</text><text class="field" x="24" y="204">description, features</text><text class="field" x="24" y="240">is_featured, is_published</text><text class="field" x="24" y="276">display_order</text><text class="note" x="24" y="312">created_at, updated_at</text></g>
  <g transform="translate(1580 230)"><rect class="box" width="500" height="330" rx="18"/><rect class="head" width="500" height="62" rx="18"/><rect class="head" y="42" width="500" height="20"/><text class="headText" x="24" y="41">portfolios</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="field" x="24" y="132">title</text><text class="field" x="24" y="168">category</text><text class="field" x="24" y="204">description</text><text class="field" x="24" y="240">image_url</text><text class="field" x="24" y="276">technologies</text><text class="note" x="24" y="312">created_at, updated_at</text></g>
  <g transform="translate(2130 230)"><rect class="box" width="500" height="330" rx="18"/><rect class="head" width="500" height="62" rx="18"/><rect class="head" y="42" width="500" height="20"/><text class="headText" x="24" y="41">articles</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="220" y="96">UQ</text><text class="field" x="275" y="96">slug</text><text class="field" x="24" y="132">title, excerpt</text><text class="field" x="24" y="168">content</text><text class="field" x="24" y="204">image_url</text><text class="field" x="24" y="240">status, published_at</text><text class="note" x="24" y="312">created_at, updated_at</text></g>

  <!-- workflow entities -->
  <g transform="translate(90 760)"><rect class="box" width="430" height="350" rx="18"/><rect class="head" width="430" height="62" rx="18"/><rect class="head" y="42" width="430" height="20"/><text class="headText" x="24" y="41">users</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="220" y="96">UQ</text><text class="field" x="275" y="96">email</text><text class="field" x="24" y="132">name, password</text><text class="field" x="24" y="168">role: admin/staff/client</text><text class="field" x="24" y="204">phone</text><text class="field" x="24" y="240">must_change_password</text><text class="field" x="24" y="276">last_login_at</text><text class="note" x="24" y="324">created_at, updated_at</text></g>
  <g transform="translate(570 760)"><rect class="box" width="430" height="350" rx="18"/><rect class="head" width="430" height="62" rx="18"/><rect class="head" y="42" width="430" height="20"/><text class="headText" x="24" y="41">inquiries</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="field" x="24" y="132">client_name</text><text class="field" x="24" y="168">client_email, client_phone</text><text class="field" x="24" y="204">budget_range</text><text class="field" x="24" y="240">project_scope</text><text class="field" x="24" y="276">status</text><text class="note" x="24" y="324">created_at, updated_at</text></g>
  <g transform="translate(1060 760)"><rect class="box" width="420" height="350" rx="18"/><rect class="head" width="420" height="62" rx="18"/><rect class="head" y="42" width="420" height="20"/><text class="headText" x="24" y="41">inquiry_replies</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="24" y="140">FK</text><text class="field" x="82" y="140">inquiry_id</text><text class="key" x="24" y="184">FK</text><text class="field" x="82" y="184">user_id</text><text class="field" x="24" y="228">reply_message</text><text class="field" x="24" y="272">sent_at</text></g>
  <g transform="translate(1720 740)"><rect class="box" width="570" height="370" rx="18"/><rect class="head" width="570" height="62" rx="18"/><rect class="head" y="42" width="570" height="20"/><text class="headText" x="24" y="41">projects</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="210" y="96">FK/UQ</text><text class="field" x="302" y="96">inquiry_id</text><text class="key" x="24" y="140">FK</text><text class="field" x="82" y="140">client_user_id, updated_by</text><text class="field" x="24" y="184">project_name, client_name</text><text class="field" x="24" y="228">total_budget</text><text class="field" x="24" y="272">status, progress_percent</text><text class="field" x="24" y="316">start_date, end_date</text><text class="note" x="330" y="348">created_at, updated_at</text></g>
  <g transform="translate(1010 1280)"><rect class="box" width="490" height="390" rx="18"/><rect class="head" width="490" height="62" rx="18"/><rect class="head" y="42" width="490" height="20"/><text class="headText" x="24" y="41">milestones</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="24" y="140">FK</text><text class="field" x="82" y="140">project_id</text><text class="field" x="24" y="184">title</text><text class="field" x="24" y="228">description</text><text class="field" x="24" y="272">due_date</text><text class="field" x="24" y="316">status, completed_at</text><text class="note" x="24" y="360">created_at, updated_at</text></g>
  <g transform="translate(1540 1280)"><rect class="box" width="590" height="430" rx="18"/><rect class="head" width="590" height="62" rx="18"/><rect class="head" y="42" width="590" height="20"/><text class="headText" x="24" y="41">project_updates</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="24" y="140">FK</text><text class="field" x="82" y="140">project_id, user_id</text><text class="field" x="24" y="184">type, title</text><text class="field" x="24" y="228">body</text><text class="field" x="24" y="272">from_status, to_status</text><text class="field" x="24" y="316">progress_percent</text><text class="field" x="24" y="360">visible_to_client</text><text class="note" x="300" y="404">created_at, updated_at</text></g>
  <g transform="translate(2180 1280)"><rect class="box" width="530" height="430" rx="18"/><rect class="head" width="530" height="62" rx="18"/><rect class="head" y="42" width="530" height="20"/><text class="headText" x="24" y="41">project_attachments</text><text class="key" x="24" y="96">PK</text><text class="field" x="82" y="96">id</text><text class="key" x="24" y="140">FK</text><text class="field" x="82" y="140">project_id, user_id</text><text class="field" x="24" y="184">original_name</text><text class="key" x="24" y="228">UQ</text><text class="field" x="82" y="228">stored_path</text><text class="field" x="24" y="272">disk, mime_type</text><text class="field" x="24" y="316">size_bytes, visibility</text><text class="note" x="255" y="404">created_at, updated_at</text></g>

  <rect class="legend" x="90" y="1735" width="2520" height="115" rx="18"/>
  <text class="key" x="120" y="1780">PK</text><text class="note" x="175" y="1780">Primary Key</text>
  <text class="key" x="390" y="1780">FK</text><text class="note" x="445" y="1780">Foreign Key</text>
  <text class="key" x="660" y="1780">UQ</text><text class="note" x="720" y="1780">Unique</text>
  <line class="relStrong" x1="950" y1="1772" x2="1050" y2="1772" marker-end="url(#arrowRed)"/><text class="note" x="1080" y="1780">core workflow relationship</text>
  <line class="rel" x1="1500" y1="1772" x2="1600" y2="1772" marker-end="url(#arrow)"/><text class="note" x="1630" y="1780">supporting relationship</text>
  <text class="note" x="120" y="1822">Delete rules: cascade for project children and inquiry replies; null-on-delete for optional ownership; restrict staff deletion when reply history exists.</text>
</svg>
